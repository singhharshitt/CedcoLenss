# Run ReviewLens from the published Docker Hub images — no source code or build needed.
#
#   1. Put this file and a .env (copy of .env.example with your LLM key) in one folder
#   2. docker compose -f docker-compose.hub.yml up -d     # → http://localhost:8088
#
# Images: https://hub.docker.com/r/harshiiitt/reviewlens-client
#         https://hub.docker.com/r/harshiiitt/reviewlens-server
# Pin a release with REVIEWLENS_TAG=1.0.0 (default: latest).

services:
  server:
    image: harshiiitt/reviewlens-server:${REVIEWLENS_TAG:-latest}
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /data/reviewlens.db
      CORS_ORIGINS: http://localhost:${APP_PORT:-8088}
    volumes:
      - reviewlens-data:/data
    expose:
      - "4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 40s
    restart: unless-stopped

  client:
    image: harshiiitt/reviewlens-client:${REVIEWLENS_TAG:-latest}
    environment:
      API_UPSTREAM: server:4000
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reviewlens-data:
